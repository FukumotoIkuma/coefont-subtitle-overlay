<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoeFont Subtitle Overlay</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; font: 13px/1.5 system-ui, sans-serif; background: #16181c; color: #e6e6e6; }
  h2 { font-size: 12px; font-weight: 600; margin: 0 0 2px; color: #bbb; }
  a { color: #7aa7ff; }
  button, input, select { font: inherit; }
  button { padding: 6px 12px; border-radius: 5px; border: 1px solid #444; background: #2a2d33; color: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: #343840; }
  button.primary { background: #2f6feb; border-color: #2f6feb; color: #fff; }
  button.primary:hover:not(:disabled) { background: #4380f0; }
  button.big { padding: 10px 14px; width: 100%; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  input[type=url] { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 5px; border: 1px solid #444; background: #101215; color: inherit; }
  select { padding: 4px; }
  #status { padding: 6px 10px; border-radius: 5px; background: #22252b; margin-bottom: 10px; white-space: pre-line; }
  #status.error { background: #4a1f1f; }
  #status.warn { background: #4a3d1f; }
  .hint { color: #999; font-size: 12px; }

  .docks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  @media (max-width: 900px) { .docks { grid-template-columns: 1fr; } }
  .dock { background: #1e2126; border: 1px solid #2c3037; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .name { flex: 1; }
  .row input[type=range] { flex: 1; min-width: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex: none; }
  .dot.on { background: #3fb950; }

  #stage { border-radius: 6px; }
  #gizmo { position: absolute; border: 2px solid #e5484d; cursor: move; display: none; }
  #gizmo span { position: absolute; left: 6px; top: 4px; font-size: 11px; color: #222; background: rgba(255, 255, 255, .8); padding: 0 4px; border-radius: 3px; pointer-events: none; white-space: nowrap; }
  #gizmo i { position: absolute; width: 12px; height: 12px; background: #e5484d; }
  #gizmo b { position: absolute; background: #2f6feb; border: 1px solid #fff; border-radius: 3px; }
  #gizmo b[data-c=t], #gizmo b[data-c=b] { left: calc(50% - 22px); width: 44px; height: 8px; cursor: ns-resize; }
  #gizmo b[data-c=l], #gizmo b[data-c=r] { top: calc(50% - 16px); width: 8px; height: 32px; cursor: ew-resize; }
  #gizmo b[data-c=t] { top: -5px; } #gizmo b[data-c=b] { bottom: -5px; }
  #gizmo b[data-c=l] { left: -5px; } #gizmo b[data-c=r] { right: -5px; }
  #gizmo i[data-h=nw] { left: -7px; top: -7px; cursor: nwse-resize; }
  #gizmo i[data-h=se] { right: -7px; bottom: -7px; cursor: nwse-resize; }
  #gizmo i[data-h=ne] { right: -7px; top: -7px; cursor: nesw-resize; }
  #gizmo i[data-h=sw] { left: -7px; bottom: -7px; cursor: nesw-resize; }
  #note { position: absolute; left: 0; right: 0; top: 0; padding: 10px; text-align: center; color: #999; pointer-events: none; }

  #foot { margin-top: 10px; display: flex; justify-content: space-between; gap: 12px; }
</style>
</head>
<body>

<div id="status"></div>

<div id="stage">
  <div id="gizmo"><span>字幕(実物は出力側に表示)</span><b data-c="t"></b><b data-c="b"></b><b data-c="l"></b><b data-c="r"></b><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div>
  <div id="note"></div>
</div>

<div class="docks">
  <div class="dock">
    <h2>ソース</h2>
    <div class="row"><span class="dot" id="dotSub"></span>
      <input type="url" id="url" placeholder="CoeFont の招待URLを貼る" autocomplete="off" spellcheck="false">
      <button data-act="loadUrl">読み込む</button></div>
    <div class="row"><span class="dot" id="dotSlide"></span><span class="name">スライドショーのウィンドウ</span>
      <button data-act="pickSlide" id="btnSlide">選択</button><button data-act="stopSlide" id="stopSlide">停止</button></div>
    <button data-act="toggleFull" id="btnFull"></button>
    <div class="hint">CoeFont の文字サイズ(A− A+)や Single / All を変えたいときだけ使う。</div>
  </div>

  <div class="dock">
    <h2>字幕の見た目</h2>
    <div class="row"><label for="blend">背景の透過</label>
      <select id="blend">
        <option value="normal">なし</option>
        <option value="multiply">白地を抜く(暗い文字用)</option>
        <option value="screen">黒地を抜く(明るい文字用)</option>
      </select></div>
    <div class="row"><label for="subOpacity">不透明度</label><input type="range" id="subOpacity" min="20" max="100"><output id="oOpacity"></output></div>
    <div class="row"><label for="textSize">文字の大きさ</label><input type="range" id="textSize" min="400" max="1600" step="20"></div>
    <div class="row"><label for="frameH">表示する行数</label><input type="range" id="frameH" min="150" max="900" step="5"></div>
    <div class="row"><button data-act="resetCrop">切り抜きを初期化</button><button data-act="resetPos">配置を初期化</button></div>
    <div class="hint">プレビューの字幕の枠: 中をドラッグで移動、赤い角で拡大縮小、青い辺で切り抜き。</div>
  </div>

  <div class="dock">
    <h2>出力</h2>
    <div class="row"><span class="dot" id="dotOut"></span><span class="name" id="outState"></span></div>
    <button class="big primary" data-act="openOutput" id="btnOut">出力ウィンドウを開く</button>
    <div class="hint">出力は別のウィンドウかタブで開く。聴衆側ディスプレイへ移し(タブならウィンドウから切り離して)、その中の「全画面にする」を押す。位置・範囲・透過は、全画面中もこの画面から調整できる。</div>
  </div>
</div>

<div id="foot" class="hint">
  <span>全画面のスライドショーより手前に出せない環境向け: <a href="pip.html">字幕だけを最前面の小窓に出す版</a></span>
  <span id="build"></span>
</div>

<script>
const $ = (id) => document.getElementById(id);
// 切り抜きの持ち方を変えたので、旧形式の保存値を読まないようキーを分ける
const STORE_KEY = 'coefont-subtitle-overlay:v2';
const URL_KEY = 'coefont-subtitle-overlay:url';
// CoeFontの視聴画面は上115〜118pxがロゴと言語切替で、その下が端から端まで字幕欄(下端で自動スクロール)。
// 字幕は欄の上から溜まっていくので、欄ごと低く描かせて「常に最新の数行だけ」が見えるようにする。
// 切り抜きは割合ではなく四辺からの余白(px)で持つ。こうすると描く大きさを変えても上の操作部だけが切れ続ける
const CROP_DEFAULTS = { fw: 800, fh: 300, it: 118, il: 0, ir: 0, ib: 0 };
const POS_DEFAULTS = { subX: 0.1, subY: 0.66, subW: 0.8 };
const DEFAULTS = { ...CROP_DEFAULTS, ...POS_DEFAULTS, subOpacity: 1, blend: 'normal' };
const BLENDS = ['normal', 'multiply', 'screen'];
const FW_RANGE = [400, 1600];
const MIN_PX = 40;
// 手元のプレビューと出力ウィンドウは別文書なので、同じ見た目の定義を両方へ差し込む
const SCENE_CSS = `
  .scene { position: relative; overflow: hidden; background: #000; user-select: none; touch-action: none; }
  .scene .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .scene .shade { position: absolute; inset: 0; background: #000; }
  .scene .sub { position: absolute; overflow: hidden; }
  .scene .content { position: absolute; left: 0; top: 0; border: 0; background: #fff; transform-origin: 0 0; }
  .scene .ph { background: repeating-linear-gradient(45deg, #cfd6e4 0 24px, #e9edf5 24px 48px); opacity: .8; }
  .scene .crop { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .scene .sel { position: absolute; border: 2px solid #2f6feb; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .55); pointer-events: none; }
`;
const OUTPUT_CSS = `
  html, body { margin: 0; height: 100%; background: #000; }
  #root { position: absolute; inset: 0; }
  #bar { position: absolute; left: 0; right: 0; top: 0; padding: 8px; display: flex; gap: 12px; align-items: center; justify-content: center;
         font: 14px system-ui, sans-serif; color: #fff; background: rgba(0, 0, 0, .75); }
  #bar button { font: inherit; padding: 6px 14px; border-radius: 5px; border: 0; background: #2f6feb; color: #fff; cursor: pointer; }
  #bar button.sub { background: #444; }
`;

let cfg = { ...DEFAULTS };
try { Object.assign(cfg, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}

// 出力側をCoeFontの画面全体の表示にしているか。普段は字幕欄だけを出し、CoeFont自体の設定を触るときだけ全体を出す
let full = false;
let url = null;
let slideStream = null;
let out = null; // 出力ウィンドウ { win, scene }

const stage = $('stage');
const gizmo = $('gizmo');
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), Math.max(lo, hi));

function setStatus(text, kind = '') {
  $('status').textContent = text;
  $('status').className = kind;
}

function addStyle(doc, css) {
  const style = doc.createElement('style');
  style.textContent = css;
  doc.head.append(style);
}

function normalize() {
  cfg.fw = clamp(cfg.fw, ...FW_RANGE);
  cfg.fh = clamp(cfg.fh, 150, 900);
  cfg.il = clamp(cfg.il, 0, cfg.fw - MIN_PX);
  cfg.ir = clamp(cfg.ir, 0, cfg.fw - cfg.il - MIN_PX);
  cfg.it = clamp(cfg.it, 0, cfg.fh - MIN_PX);
  cfg.ib = clamp(cfg.ib, 0, cfg.fh - cfg.it - MIN_PX);
  cfg.subW = clamp(cfg.subW, 0.1, 1);
  cfg.subX = clamp(cfg.subX, 0, 1 - cfg.subW);
  cfg.subY = clamp(cfg.subY, 0, 0.98);
  if (!BLENDS.includes(cfg.blend)) cfg.blend = DEFAULTS.blend;
}

// --- スライド+字幕の合成画面 ---
// 出力ウィンドウ(real)にはCoeFontのiframeを置く。手元のプレビューに同じiframeを置くと二重に参加して
// 音声も二重になるので、手元は同じ寸法の代用の板で位置と範囲だけを示す
function makeScene(doc, root, real) {
  root.classList.add('scene');
  const slide = doc.createElement('video');
  slide.className = 'slide';
  slide.muted = true;
  slide.playsInline = true;
  slide.autoplay = true;
  const shade = doc.createElement('div');
  shade.className = 'shade';
  const sub = doc.createElement('div');
  sub.className = 'sub';
  const content = doc.createElement(real ? 'iframe' : 'div');
  content.className = real ? 'content' : 'content ph';
  if (real) {
    content.allow = 'autoplay; microphone; clipboard-write';
    content.title = 'CoeFont';
  }
  const crop = doc.createElement('div');
  crop.className = 'crop';
  const sel = doc.createElement('div');
  sel.className = 'sel';
  crop.append(sel);
  sub.append(content, crop);
  root.prepend(slide, shade, sub);
  for (const ev of ['loadedmetadata', 'resize', 'emptied']) slide.addEventListener(ev, layout);
  return { doc, root, slide, shade, sub, content, crop, sel, real };
}

function layoutScene(sc) {
  const W = sc.root.clientWidth, H = sc.root.clientHeight;
  // 手元のプレビューは常に聴衆に見える構図を示す。全体表示に切り替わるのは出力側だけ
  const composing = !(sc.real && full);
  // スライドの映像自体をvisibilityやopacityで隠すと、戻したあとも黒いまま再描画されない環境がある(Chromium系の組み込みブラウザで再現)。
  // 映像には触らず、上に黒い幕を掛けて隠す
  sc.shade.style.display = composing ? 'none' : '';
  sc.sub.style.display = url ? '' : 'none';
  // 出力先の大きさでCoeFont側のレイアウトが変わると切り抜きがずれるので、決めた大きさで描かせて拡大縮小だけする
  sc.content.style.width = cfg.fw + 'px';
  sc.content.style.height = cfg.fh + 'px';
  const cw = cfg.fw - cfg.il - cfg.ir, ch = cfg.fh - cfg.it - cfg.ib;

  let scale, box, shift = [0, 0];
  if (composing) {
    const width = cfg.subW * W;
    scale = width / cw;
    box = { left: cfg.subX * W, top: cfg.subY * H, width, height: ch * scale };
    shift = [-cfg.il, -cfg.it];
  } else {
    // CoeFont自体の設定は、切り抜く前の全体を見せて行う
    scale = Math.min(W / cfg.fw, H / cfg.fh);
    box = { left: (W - cfg.fw * scale) / 2, top: (H - cfg.fh * scale) / 2, width: cfg.fw * scale, height: cfg.fh * scale };
  }
  for (const k in box) sc.sub.style[k] = box[k] + 'px';
  sc.content.style.transform = `scale(${scale}) translate(${shift[0]}px, ${shift[1]}px)`;
  sc.crop.style.display = composing ? 'none' : '';
  sc.sel.style.left = cfg.il / cfg.fw * 100 + '%';
  sc.sel.style.top = cfg.it / cfg.fh * 100 + '%';
  sc.sel.style.width = cw / cfg.fw * 100 + '%';
  sc.sel.style.height = ch / cfg.fh * 100 + '%';
  if (sc.real) {
    // 開始ボタンは字幕欄の中に出るので、字幕表示のままでも押せるようにしておく。全画面で見せている間だけ触れなくする
    sc.content.style.pointerEvents = sc.doc.fullscreenElement && composing ? 'none' : 'auto';
    // 下地のスライドがないまま白地や黒地を抜くと、黒い背景に溶けて字幕ごと見えなくなる
    sc.sub.style.mixBlendMode = composing && slideStream ? cfg.blend : 'normal';
    sc.sub.style.opacity = composing ? cfg.subOpacity : 1;
    // 全画面で字幕を出している間はカーソルを聴衆に見せない
    sc.root.style.cursor = sc.doc.fullscreenElement && composing ? 'none' : '';
  }
  return box;
}

const ctl = makeScene(document, stage, false);
addStyle(document, SCENE_CSS);

function layout() {
  // スライドショーは聴衆側ディスプレイを全面で覆うので、縦横比をスライドに合わせれば出力と配置が一致する
  const ratio = ctl.slide.videoWidth ? ctl.slide.videoWidth / ctl.slide.videoHeight : 16 / 9;
  stage.style.aspectRatio = ratio;
  // 下の操作パネルが画面外へ押し出されない高さに収める
  stage.style.maxWidth = `min(1100px, ${55 * ratio}vh)`;
  const box = layoutScene(ctl);
  gizmo.style.display = url ? 'block' : 'none';
  for (const k in box) gizmo.style[k] = box[k] + 'px';
  if (out) layoutScene(out.scene);
  $('note').textContent = !url ? '「ソース」に CoeFont の招待URLを貼って読み込む'
    : !slideStream ? 'スライド未選択(聴衆には黒い背景に字幕だけが見える。透過はスライドを選ぶと効く)' : '';
}
new ResizeObserver(layout).observe(stage);

function render() {
  normalize();
  $('blend').value = cfg.blend;
  $('subOpacity').value = cfg.subOpacity * 100;
  $('oOpacity').textContent = Math.round(cfg.subOpacity * 100) + '%';
  // 狭く描かせるほど、同じ字幕枠に対して文字が大きく映る
  $('textSize').value = FW_RANGE[0] + FW_RANGE[1] - cfg.fw;
  $('frameH').value = cfg.fh;
  const fullLabel = full ? '字幕表示に戻す' : 'CoeFont の画面全体を表示';
  $('btnFull').textContent = '出力側: ' + fullLabel;
  $('btnFull').disabled = !out;
  if (out) out.fullBtn.textContent = fullLabel;
  $('dotSub').classList.toggle('on', !!url);
  $('dotSlide').classList.toggle('on', !!slideStream);
  $('dotOut').classList.toggle('on', !!out);
  $('outState').textContent = out ? '出力ウィンドウ: 表示中' : '出力ウィンドウ: 未表示';
  $('btnOut').textContent = out ? '出力ウィンドウを前面に出す' : '出力ウィンドウを開く';
  $('btnSlide').textContent = slideStream ? '変更' : '選択';
  $('stopSlide').disabled = !slideStream;
  layout();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch {}
}

function attach(video, s) {
  video.srcObject = s;
  if (s) video.play().catch(() => {});
}

// --- 出力ウィンドウ ---
function openOutput() {
  if (out && !out.win.closed) {
    out.win.focus();
    return out;
  }
  const win = window.open('', 'coefont-output', 'popup,width=960,height=540');
  if (!win) {
    setStatus('出力ウィンドウがブロックされました。アドレスバーの表示からこのサイトのポップアップを許可してください。', 'error');
    return null;
  }
  const doc = win.document;
  doc.title = '字幕出力';
  doc.head.innerHTML = '';
  doc.body.innerHTML = '';
  addStyle(doc, SCENE_CSS + OUTPUT_CSS);
  const root = doc.createElement('div');
  root.id = 'root';
  const bar = doc.createElement('div');
  bar.id = 'bar';
  const go = doc.createElement('button');
  go.textContent = '全画面にする';
  const fullBtn = doc.createElement('button');
  fullBtn.className = 'sub';
  bar.append('聴衆側ディスプレイへ移動してから →', go, '(Esc で解除)', fullBtn);
  doc.body.append(root, bar);

  const self = { win, fullBtn, scene: makeScene(doc, root, true) };
  out = self;
  if (url) self.scene.content.src = url;
  attach(self.scene.slide, slideStream);
  go.addEventListener('click', () => {
    // 全体表示のまま聴衆に出してしまわないよう、全画面にするときは字幕表示へ戻す
    full = false;
    render();
    doc.documentElement.requestFullscreen().catch(() => {});
  });
  fullBtn.addEventListener('click', toggleFull);
  doc.addEventListener('fullscreenchange', () => {
    bar.style.display = doc.fullscreenElement ? 'none' : '';
    layout();
  });
  win.addEventListener('resize', layout);
  win.addEventListener('pagehide', () => {
    if (out !== self) return;
    out = null;
    full = false;
    render();
    setStatus('出力ウィンドウが閉じられました。「出力ウィンドウを開く」で開き直せます(CoeFont は読み込み直しになります)。', 'warn');
  });
  render();
  return self;
}

// --- ソース ---
// CoeFontはタブ共有で取り込まず、ページそのものを埋め込む。タブ共有を使うと、共有中はChromeが
// 同じプロファイルの全タブ(出力ウィンドウを含む)に「共有しています」バーを出し、ページ側から消せないため
function loadUrl() {
  let u;
  try { u = new URL($('url').value.trim()); } catch {}
  if (!u || u.protocol !== 'https:') {
    setStatus('CoeFont の招待URL(https://〜)を貼ってください。', 'warn');
    return;
  }
  url = u.href;
  try { sessionStorage.setItem(URL_KEY, url); } catch {}
  const o = openOutput();
  if (!o) return;
  o.scene.content.src = url;
  render();
  setStatus('別のウィンドウ(またはタブ)に出力を開きました。そこに出ている字幕の枠の中で CoeFont の開始ボタンを押してください。\n別のタブでも同じ招待URLを開いていると音声が二重に鳴るので、そちらは閉じてください。');
}

function setSlide(s) {
  if (slideStream) slideStream.getTracks().forEach((t) => { t.onended = null; t.stop(); });
  slideStream = s;
  attach(ctl.slide, s);
  if (out) attach(out.scene.slide, s);
  render();
}

async function pickSlide() {
  let s;
  try {
    s = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface: 'window', frameRate: { ideal: 30 } },
      audio: false,
      selfBrowserSurface: 'exclude',
      // 画面全体を選ぶと、全画面にした出力ウィンドウ自身が映り込んで合わせ鏡になる
      monitorTypeSurfaces: 'exclude',
    });
  } catch (e) {
    if (e.name === 'NotAllowedError') {
      setStatus('ウィンドウの選択がキャンセル(または拒否)されました。\nmacOSで毎回失敗する場合は、システム設定 > プライバシーとセキュリティ > 画面収録 でブラウザを許可してください。', 'warn');
    } else {
      setStatus(`スライドを取得できませんでした: ${e.name}: ${e.message}`, 'error');
    }
    return;
  }
  setSlide(s);
  const track = s.getVideoTracks()[0];
  track.onended = () => {
    setSlide(null);
    setStatus('スライドの画面共有が終了しました。ソースの「選択」で再接続できます。', 'warn');
  };
  const surface = track.getSettings().displaySurface;
  if (surface === 'browser') {
    setStatus('タブが選ばれています。タブを共有すると Chrome の「共有しています」バーが出力ウィンドウにも出ます。選択画面の「ウィンドウ」からスライドショーを選び直してください。', 'warn');
  } else if (surface === 'monitor') {
    setStatus('画面全体が選ばれています。出力ウィンドウと同じディスプレイだと合わせ鏡になるので、スライドショーの「ウィンドウ」を選び直してください。', 'warn');
  } else {
    setStatus('スライドを取得中。赤枠を動かして字幕の位置を決めてください。');
  }
}

function toggleFull() {
  full = !full;
  render();
}

// --- 字幕の枠を直接つかむ: 中=移動、角(赤)=拡大縮小、辺(青)=切り抜き ---
let grab = null;
gizmo.addEventListener('pointerdown', (e) => {
  grab = {
    handle: e.target.dataset.h || '', edge: e.target.dataset.c || '', px: e.clientX, py: e.clientY,
    start: { ...cfg },
    W: stage.clientWidth, H: stage.clientHeight,
    l: gizmo.offsetLeft, t: gizmo.offsetTop, w: gizmo.offsetWidth, h: gizmo.offsetHeight,
  };
  gizmo.setPointerCapture(e.pointerId);
  e.preventDefault();
});
gizmo.addEventListener('pointermove', (e) => {
  if (!grab) return;
  const { handle, edge, start, W, H, l, t, w, h } = grab;
  const dx = e.clientX - grab.px, dy = e.clientY - grab.py;
  if (edge) {
    // 切り抜きでは拡大率を変えず、つかんだ辺だけがマウスに付いてくるようにする(反対側の辺と中身は動かさない)
    const cw = start.fw - start.il - start.ir, ch = start.fh - start.it - start.ib;
    const scale = w / cw;
    if (edge === 't') {
      const d = clamp(dy / scale, -start.it, ch - MIN_PX);
      cfg.it = start.it + d;
      cfg.subY = start.subY + d * scale / H;
    } else if (edge === 'b') {
      cfg.ib = start.ib - clamp(dy / scale, -(ch - MIN_PX), start.ib);
    } else if (edge === 'l') {
      const d = clamp(dx / scale, -start.il, cw - MIN_PX);
      cfg.il = start.il + d;
      cfg.subX = start.subX + d * scale / W;
      cfg.subW = (cw - d) * scale / W;
    } else {
      const d = clamp(dx / scale, -(cw - MIN_PX), start.ir);
      cfg.ir = start.ir - d;
      cfg.subW = (cw + d) * scale / W;
    }
  } else if (!handle) {
    cfg.subX = (l + dx) / W;
    cfg.subY = (t + dy) / H;
  } else {
    // 縦横比は字幕の範囲で決まるので幅だけ動かし、掴んだ角の対角を固定する
    const nw = clamp(handle.includes('w') ? w - dx : w + dx, W * 0.1, W);
    const nh = nw * h / w;
    cfg.subW = nw / W;
    cfg.subX = (handle.includes('w') ? l + w - nw : l) / W;
    cfg.subY = (handle.includes('n') ? t + h - nh : t) / H;
  }
  render();
});
for (const ev of ['pointerup', 'pointercancel']) gizmo.addEventListener(ev, () => { grab = null; });

// --- 操作 ---
const actions = {
  loadUrl, pickSlide, openOutput, toggleFull,
  stopSlide: () => { setSlide(null); setStatus('スライドの共有を停止しました。'); },
  resetCrop: () => { Object.assign(cfg, CROP_DEFAULTS); render(); },
  resetPos: () => { Object.assign(cfg, POS_DEFAULTS); render(); },
};
document.addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act) actions[act]();
});
$('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadUrl(); });
$('blend').addEventListener('change', (e) => { cfg.blend = e.target.value; render(); });
$('textSize').addEventListener('input', (e) => { cfg.fw = FW_RANGE[0] + FW_RANGE[1] - e.target.value; render(); });
$('frameH').addEventListener('input', (e) => { cfg.fh = +e.target.value; render(); });
$('subOpacity').addEventListener('input', (e) => { cfg.subOpacity = e.target.value / 100; render(); });
// このタブを閉じると出力ウィンドウを操作できなくなるので道連れにする
window.addEventListener('pagehide', () => { if (out) out.win.close(); });

// --- 環境判定 ---
if (!navigator.mediaDevices?.getDisplayMedia) {
  setStatus(window.isSecureContext
    ? 'このブラウザはスライドの取り込み(画面共有)に対応していません。デスクトップ版の Chrome / Edge を使ってください。'
    : 'このページは HTTPS(または localhost)で開く必要があります。', 'error');
  $('btnSlide').disabled = true;
} else {
  setStatus('① CoeFont の招待URLを読み込む(出力が別ウィンドウかタブで開く) → ② 出力側の字幕の枠内で CoeFont を開始 → ③ スライドショーのウィンドウを選択 → ④ 出力を聴衆側ディスプレイで全画面にする');
}

// 再読み込みで貼り直さずに済むよう、タブを閉じるまでだけURLを覚えておく(招待URLを長く残さない)
try { $('url').value = sessionStorage.getItem(URL_KEY) || ''; } catch {}
// 配信側が10分キャッシュするので、古い版を見ていないか利用者が確かめられるようにする
$('build').textContent = '配信日時: ' + document.lastModified;

render();
</script>
</body>
</html>
