<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoeFont Subtitle Overlay</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; font: 13px/1.5 system-ui, sans-serif; background: #16181c; color: #e6e6e6; }
  h2 { font-size: 12px; font-weight: 600; margin: 0 0 2px; color: #bbb; }
  a { color: #7aa7ff; }
  button, input, select { font: inherit; }
  button { padding: 6px 12px; border-radius: 5px; border: 1px solid #444; background: #2a2d33; color: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: #343840; }
  button.primary { background: #2f6feb; border-color: #2f6feb; color: #fff; }
  button.primary:hover:not(:disabled) { background: #4380f0; }
  button.big { padding: 10px 14px; width: 100%; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  input[type=url] { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 5px; border: 1px solid #444; background: #101215; color: inherit; }
  select { padding: 4px; }
  #status { padding: 6px 10px; border-radius: 5px; background: #22252b; margin-bottom: 10px; white-space: pre-line; }
  #status.error { background: #4a1f1f; }
  #status.warn { background: #4a3d1f; }
  .hint { color: #999; font-size: 12px; }

  .docks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  @media (max-width: 900px) { .docks { grid-template-columns: 1fr; } }
  .dock { background: #1e2126; border: 1px solid #2c3037; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .name { flex: 1; }
  .row input[type=range] { flex: 1; min-width: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex: none; }
  .dot.on { background: #3fb950; }

  #stage { border-radius: 6px; }
  #gizmo { position: absolute; border: 2px solid #e5484d; cursor: move; display: none; }
  #gizmo span { position: absolute; left: 6px; top: 4px; font-size: 11px; color: #222; background: rgba(255, 255, 255, .8); padding: 0 4px; border-radius: 3px; pointer-events: none; white-space: nowrap; }
  #gizmo i { position: absolute; width: 12px; height: 12px; background: #e5484d; }
  #gizmo b { position: absolute; background: #2f6feb; border: 1px solid #fff; border-radius: 3px; }
  #gizmo b[data-c=t], #gizmo b[data-c=b] { left: calc(50% - 22px); width: 44px; height: 8px; cursor: ns-resize; }
  #gizmo b[data-c=l], #gizmo b[data-c=r] { top: calc(50% - 16px); width: 8px; height: 32px; cursor: ew-resize; }
  #gizmo b[data-c=t] { top: -5px; } #gizmo b[data-c=b] { bottom: -5px; }
  #gizmo b[data-c=l] { left: -5px; } #gizmo b[data-c=r] { right: -5px; }
  #gizmo i[data-h=nw] { left: -7px; top: -7px; cursor: nwse-resize; }
  #gizmo i[data-h=se] { right: -7px; bottom: -7px; cursor: nwse-resize; }
  #gizmo i[data-h=ne] { right: -7px; top: -7px; cursor: nesw-resize; }
  #gizmo i[data-h=sw] { left: -7px; bottom: -7px; cursor: nesw-resize; }
  /* 並べる配置(下・左右)では字幕は領域に収まる大きさで中央に置かれるので、移動と拡大縮小のつまみは出さない */
  #gizmo.split { cursor: default; }
  #gizmo.split i { display: none; }
  /* 字幕が領域いっぱいのとき、辺のつまみが境界線と重なって掴めなくなるので内側へずらす */
  #gizmo.split b[data-c=t] { top: 10px; } #gizmo.split b[data-c=b] { bottom: 10px; }
  #gizmo.split b[data-c=l] { left: 10px; } #gizmo.split b[data-c=r] { right: 10px; }
  /* スライドと字幕の境界。細い線だと掴みにくいので、見た目より広い当たり判定を持たせる */
  #divider { position: absolute; background: #e5484d; }
  #divider::before { content: ''; position: absolute; }
  #divider.h { left: 0; right: 0; height: 4px; margin-top: -2px; cursor: ns-resize; }
  #divider.h::before { left: 0; right: 0; top: -7px; bottom: -7px; }
  #divider.v { top: 0; bottom: 0; width: 4px; margin-left: -2px; cursor: ew-resize; }
  #divider.v::before { top: 0; bottom: 0; left: -7px; right: -7px; }
  [hidden] { display: none !important; }
  #note { position: absolute; left: 0; right: 0; top: 0; padding: 10px; text-align: center; color: #999; pointer-events: none; }

  #foot { margin-top: 10px; display: flex; justify-content: space-between; gap: 12px; }
</style>
</head>
<body>

<div id="status"></div>

<div id="stage">
  <div id="gizmo"><span id="gizmoLabel"></span><b data-c="t"></b><b data-c="b"></b><b data-c="l"></b><b data-c="r"></b><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div>
  <div id="divider" hidden></div>
  <div id="note"></div>
</div>

<div class="docks">
  <div class="dock">
    <h2>ソース</h2>
    <div class="row"><span class="dot" id="dotSub"></span>
      <input type="url" id="url" placeholder="CoeFont の招待URLを貼る" autocomplete="off" spellcheck="false">
      <button data-act="loadUrl">読み込む</button></div>
    <div class="row"><span class="dot" id="dotSlide"></span><span class="name">スライドショーのウィンドウ</span>
      <button data-act="pickSlide" id="btnSlide">選択</button><button data-act="stopSlide" id="stopSlide">停止</button></div>
    <button data-act="toggleFull" id="btnFull"></button>
    <div class="hint">切り抜いたあとで CoeFont の設定(A− A+、Single / All など)を変えたいときに使う。</div>
  </div>

  <div class="dock">
    <h2>レイアウトと字幕</h2>
    <div class="row"><label for="layoutSel">配置</label>
      <select id="layoutSel">
      </select></div>
    <div class="row" id="rowBand"><label for="band" id="bandLabel"></label><input type="range" id="band" min="8" max="60" step="0.5"><output id="oBand"></output></div>
    <div class="row" id="rowBlend"><label for="blend">背景の透過</label>
      <select id="blend">
        <option value="normal">なし</option>
        <option value="multiply">白地を抜く(暗い文字用)</option>
        <option value="screen">黒地を抜く(明るい文字用)</option>
      </select></div>
    <div class="row" id="rowOpacity"><label for="subOpacity">不透明度</label><input type="range" id="subOpacity" min="20" max="100"><output id="oOpacity"></output></div>
    <div class="row"><label for="winW">CoeFont の窓の幅</label><input type="range" id="winW" step="10"><output id="oWinW"></output></div>
    <div class="row"><label for="winH">CoeFont の窓の高さ</label><input type="range" id="winH" step="10"><output id="oWinH"></output></div>
    <div class="hint">CoeFont を描く窓の形。幅を狭くするほど文字が大きく映り、高さを増やすほど行数が増える。</div>
    <button data-act="fitWindow" id="btnFit">窓の形を字幕の領域に合わせる</button>
    <div class="hint" id="fitNote"></div>
    <div class="row"><button data-act="resetCrop">切り抜きを初期化</button><button data-act="resetWindow">窓の形を初期化</button><button data-act="resetPos" id="btnResetPos">配置を初期化</button></div>
    <div class="hint" id="gizmoHint"></div>
  </div>

  <div class="dock">
    <h2>出力</h2>
    <div class="row"><span class="dot" id="dotOut"></span><span class="name" id="outState"></span></div>
    <button class="big primary" data-act="openOutput" id="btnOut">出力ウィンドウを開く</button>
    <div class="hint">出力は別のウィンドウかタブで開く。聴衆側ディスプレイへ移し(タブならウィンドウから切り離して)、その中の「全画面にする」を押す。位置・範囲・透過は、全画面中もこの画面から調整できる。</div>
  </div>
</div>

<div id="foot" class="hint">
  <span>全画面のスライドショーより手前に出せない環境向け: <a href="pip.html">字幕だけを最前面の小窓に出す版</a></span>
  <span id="build"></span>
</div>

<script>
const $ = (id) => document.getElementById(id);
// 初期値を「切り抜きなし」に変えたので、以前の版が保存した切り抜きを引き継がないようキーを分ける
const STORE_KEY = 'coefont-subtitle-overlay:v3';
const URL_KEY = 'coefont-subtitle-overlay:url';
// 初期状態では切り抜かない。どこを見せるかは利用者が決めるもので、最初から操作部を切り落とすと
// CoeFont側の設定(文字サイズ、Single/All、言語)に触れなくなる。
// 切り抜きは割合ではなく四辺からの余白(px)で持つ。こうすると描く大きさを変えても切った位置がずれない
// 窓の形と切り抜きは別々の設定なので、初期値も初期化も分けておく
const WINDOW_DEFAULTS = { fw: 960, fh: 540 };
const CROP_DEFAULTS = { it: 0, il: 0, ir: 0, ib: 0 };
const POS_DEFAULTS = { subX: 0.25, subY: 0.4, subW: 0.5 };
// band: 並べる配置で字幕の領域が占める割合(下なら高さ、左右なら幅)。境界の位置だけを表し、CoeFontの切り抜きとは無関係
const DEFAULTS = { ...WINDOW_DEFAULTS, ...CROP_DEFAULTS, ...POS_DEFAULTS, subOpacity: 1, blend: 'normal', layout: 'overlay', band: 0.22 };
// 並べる配置の定義。axis: 境界線が区切る向き(x=左右, y=上下)、subFirst: 字幕の領域が先(左/上)に来るか。
// 選択肢・領域の計算・境界線の向き・ドラッグをすべてここから導くので、画面側は配置を増やすときここに1行足せば足りる
const OVERLAY_LABEL = 'スライドに重ねる';
const SPLITS = {
  below: { label: 'スライドの下に並べる', axis: 'y', subFirst: false },
  right: { label: 'スライドの右に並べる', axis: 'x', subFirst: false },
  left: { label: 'スライドの左に並べる', axis: 'x', subFirst: true },
};
const LAYOUTS = ['overlay', ...Object.keys(SPLITS)];
const RECT_KEYS = ['left', 'top', 'width', 'height'];
const BAND_RANGE = [0.08, 0.6];
const BLENDS = ['normal', 'multiply', 'screen'];
// CoeFontを描く窓の大きさ(px)。左右に並べる配置では縦長にしたいので、高さは幅より大きく取れるようにしておく
// 高さの下限を低くしてあるのは、下に並べる配置の細い領域に形を合わせると100px前後になるため
const WIN_W_RANGE = [300, 1600];
const WIN_H_RANGE = [60, 2000];
const WINDOW_SLIDERS = [
  { input: 'winW', output: 'oWinW', key: 'fw', range: WIN_W_RANGE, name: '幅' },
  { input: 'winH', output: 'oWinH', key: 'fh', range: WIN_H_RANGE, name: '高さ' },
];
const MIN_PX = 40;
// 重ねる配置で字幕の枠が取れる最小の幅(画面幅に対する割合)
const MIN_SUB_W = 0.1;
const NUMERIC_KEYS = Object.keys(DEFAULTS).filter((k) => typeof DEFAULTS[k] === 'number');
// 手元のプレビューと出力ウィンドウは別文書なので、同じ見た目の定義を両方へ差し込む
const SCENE_CSS = `
  .scene { position: relative; overflow: hidden; background: #000; user-select: none; touch-action: none; }
  .scene .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .scene .shade { position: absolute; inset: 0; background: #000; }
  .scene .sub { position: absolute; overflow: hidden; }
  .scene .content { position: absolute; left: 0; top: 0; border: 0; background: #fff; transform-origin: 0 0; }
  .scene .ph { background: repeating-linear-gradient(45deg, #cfd6e4 0 24px, #e9edf5 24px 48px); opacity: .8; }
  .scene .crop { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .scene .outline { position: absolute; box-sizing: border-box; border: 3px solid #e5484d; pointer-events: none; }
  .scene .sel { position: absolute; border: 2px solid #2f6feb; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .55); pointer-events: none; }
`;
const OUTPUT_CSS = `
  html, body { margin: 0; height: 100%; background: #000; }
  #root { position: absolute; inset: 0; }
  #bar { position: absolute; left: 0; right: 0; top: 0; padding: 8px; display: flex; gap: 12px; align-items: center; justify-content: center;
         font: 14px system-ui, sans-serif; color: #fff; background: rgba(0, 0, 0, .75); }
  #bar button { font: inherit; padding: 6px 14px; border-radius: 5px; border: 0; background: #2f6feb; color: #fff; cursor: pointer; }
  #bar button.sub { background: #444; }
`;

let cfg = { ...DEFAULTS };
try { Object.assign(cfg, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}

// 出力側をCoeFontの画面全体の表示にしているか。普段は字幕欄だけを出し、CoeFont自体の設定を触るときだけ全体を出す
let full = false;
let url = null;
// 位置や大きさを調整している最中か(出力側に枠線を出す間)
let adjusting = false;
let adjustTimer = 0;
let slideStream = null;
let out = null; // 出力ウィンドウ { win, scene }

const stage = $('stage');
const gizmo = $('gizmo');
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), Math.max(lo, hi));
// 継承されたプロパティ名(toString など)を配置と見なさないよう、自前のキーだけを引く
const currentSplit = () => (Object.hasOwn(SPLITS, cfg.layout) ? SPLITS[cfg.layout] : null);
const isSplit = () => !!currentSplit();

function setStatus(text, kind = '') {
  $('status').textContent = text;
  $('status').className = kind;
}

function addStyle(doc, css) {
  const style = doc.createElement('style');
  style.textContent = css;
  doc.head.append(style);
}

function normalize() {
  // 保存値に数値以外が紛れていると NaN が計算全体に広がって何も表示されなくなるので、数値の設定はすべて初期値へ戻す
  for (const k of NUMERIC_KEYS) if (typeof cfg[k] !== 'number' || !Number.isFinite(cfg[k])) cfg[k] = DEFAULTS[k];
  for (const k of Object.keys(CROP_DEFAULTS)) cfg[k] = Math.max(0, cfg[k]);
  // 窓を縮めても切り抜きは変えない。切り抜きを詰めて合わせると、窓を戻しても切った位置が元に戻らないので、
  // 切り抜きが収まらなくなる大きさには窓のほうを縮めさせない
  cfg.fw = clamp(Math.max(cfg.fw, cfg.il + cfg.ir + MIN_PX), ...WIN_W_RANGE);
  cfg.fh = clamp(Math.max(cfg.fh, cfg.it + cfg.ib + MIN_PX), ...WIN_H_RANGE);
  // ここから4行は、保存値が壊れていて窓の上限でも切り抜きが収まらないときだけ効く保険
  cfg.il = clamp(cfg.il, 0, cfg.fw - MIN_PX);
  cfg.ir = clamp(cfg.ir, 0, cfg.fw - cfg.il - MIN_PX);
  cfg.it = clamp(cfg.it, 0, cfg.fh - MIN_PX);
  cfg.ib = clamp(cfg.ib, 0, cfg.fh - cfg.it - MIN_PX);
  if (!LAYOUTS.includes(cfg.layout)) cfg.layout = DEFAULTS.layout;
  cfg.band = clamp(cfg.band, ...BAND_RANGE);
  cfg.subW = clamp(cfg.subW, MIN_SUB_W, 1);
  cfg.subX = clamp(cfg.subX, 0, 1 - cfg.subW);
  cfg.subY = clamp(cfg.subY, 0, 0.98);
  if (!BLENDS.includes(cfg.blend)) cfg.blend = DEFAULTS.blend;
}

// --- スライド+字幕の合成画面 ---
// 出力ウィンドウ(real)にはCoeFontのiframeを置く。手元のプレビューに同じiframeを置くと二重に参加して
// 音声も二重になるので、手元は同じ寸法の代用の板で位置と範囲だけを示す
function makeScene(doc, root, real) {
  root.classList.add('scene');
  const slide = doc.createElement('video');
  slide.className = 'slide';
  slide.muted = true;
  slide.playsInline = true;
  slide.autoplay = true;
  const shade = doc.createElement('div');
  shade.className = 'shade';
  const sub = doc.createElement('div');
  sub.className = 'sub';
  const content = doc.createElement(real ? 'iframe' : 'div');
  content.className = real ? 'content' : 'content ph';
  if (real) {
    content.allow = 'autoplay; microphone; clipboard-write';
    content.title = 'CoeFont';
  }
  const crop = doc.createElement('div');
  crop.className = 'crop';
  const sel = doc.createElement('div');
  sel.className = 'sel';
  crop.append(sel);
  sub.append(content, crop);
  // 透過中は字幕の枠の端が出力側で見えないので、調整している間だけ枠線を出す。合成モードが掛からないよう字幕とは別要素にする
  const outline = doc.createElement('div');
  outline.className = 'outline';
  root.prepend(slide, shade, sub, outline);
  for (const ev of ['loadedmetadata', 'resize', 'emptied']) slide.addEventListener(ev, layout);
  // origin: いま窓の左上がどこにどの拡大率で置かれているか。frozen: 切り抜きの辺を掴んでいる間、収め直しを止めるために控えたorigin
  return { doc, root, slide, shade, sub, content, crop, sel, outline, real, origin: null, frozen: null };
}

// 並べる配置での、スライドの領域と字幕の領域。重ねる配置では分けないので null
function regions(W, H) {
  const sp = currentSplit();
  if (!sp) return null;
  const horizontal = sp.axis === 'x';
  const total = horizontal ? W : H;
  const subLen = total * cfg.band;
  const along = (start, len) => horizontal
    ? { left: start, top: 0, width: len, height: H }
    : { left: 0, top: start, width: W, height: len };
  return sp.subFirst
    ? { sub: along(0, subLen), slide: along(subLen, total - subLen) }
    : { slide: along(0, total - subLen), sub: along(total - subLen, subLen) };
}

function layoutScene(sc) {
  const W = sc.root.clientWidth, H = sc.root.clientHeight;
  // 手元のプレビューは常に聴衆に見える構図を示す。全体表示に切り替わるのは出力側だけ
  const composing = !(sc.real && full);
  // スライドの映像自体をvisibilityやopacityで隠すと、戻したあとも黒いまま再描画されない環境がある(Chromium系の組み込みブラウザで再現)。
  // 映像には触らず、上に黒い幕を掛けて隠す
  sc.shade.style.display = composing ? 'none' : '';
  sc.sub.style.display = url ? '' : 'none';
  const split = composing ? regions(W, H) : null;
  const fh = cfg.fh;
  const cw = cfg.fw - cfg.il - cfg.ir, ch = fh - cfg.it - cfg.ib;
  // 出力先の大きさでCoeFont側のレイアウトが変わると切り抜きがずれるので、決めた大きさで描かせて拡大縮小だけする
  sc.content.style.width = cfg.fw + 'px';
  sc.content.style.height = fh + 'px';
  // 並べる配置では、スライドを自分の領域に縮めて収める(空にするとCSSの全面表示に戻る)
  for (const k of RECT_KEYS) sc.slide.style[k] = split ? split.slide[k] + 'px' : '';

  let scale, box, shift = [0, 0];
  // 控えた位置は掴んだ時点の画面の大きさでの値なので、途中で大きさが変わったら捨てて収め直す
  if (sc.frozen && (sc.frozen.W !== W || sc.frozen.H !== H)) sc.frozen = null;
  if (split && sc.frozen) {
    // 切り抜きの辺を掴んでいる間は収め直さない。毎回収め直すと枠全体が動いて、掴んだ辺がマウスに付いてこなくなる
    scale = sc.frozen.scale;
    box = { left: sc.frozen.left + cfg.il * scale, top: sc.frozen.top + cfg.it * scale, width: cw * scale, height: ch * scale };
    shift = [-cfg.il, -cfg.it];
  } else if (split) {
    // 見せる範囲は利用者が決めた切り抜きのまま。領域に合わせて切り足しはせず、収まる大きさに拡大縮小して中央に置く
    const r = split.sub;
    scale = Math.min(r.width / cw, r.height / ch);
    box = { left: r.left + (r.width - cw * scale) / 2, top: r.top + (r.height - ch * scale) / 2, width: cw * scale, height: ch * scale };
    shift = [-cfg.il, -cfg.it];
  } else if (composing) {
    const width = cfg.subW * W;
    scale = width / cw;
    box = { left: cfg.subX * W, top: cfg.subY * H, width, height: ch * scale };
    shift = [-cfg.il, -cfg.it];
  } else {
    // CoeFont自体の設定は、切り抜く前の全体を見せて行う
    scale = Math.min(W / cfg.fw, H / fh);
    box = { left: (W - cfg.fw * scale) / 2, top: (H - fh * scale) / 2, width: cfg.fw * scale, height: fh * scale };
  }
  sc.origin = { scale, left: box.left + shift[0] * scale, top: box.top + shift[1] * scale, W, H };
  for (const k in box) sc.sub.style[k] = sc.outline.style[k] = box[k] + 'px';
  sc.outline.style.display = sc.real && adjusting && composing && url ? '' : 'none';
  sc.content.style.transform = `scale(${scale}) translate(${shift[0]}px, ${shift[1]}px)`;
  sc.crop.style.display = composing ? 'none' : '';
  sc.sel.style.left = cfg.il / cfg.fw * 100 + '%';
  sc.sel.style.top = cfg.it / fh * 100 + '%';
  sc.sel.style.width = cw / cfg.fw * 100 + '%';
  sc.sel.style.height = ch / fh * 100 + '%';
  if (sc.real) {
    // 開始ボタンは字幕欄の中に出るので、字幕表示のままでも押せるようにしておく。全画面で見せている間だけ触れなくする
    sc.content.style.pointerEvents = sc.doc.fullscreenElement && composing ? 'none' : 'auto';
    // 下地のスライドがないまま白地や黒地を抜くと、黒い背景に溶けて字幕ごと見えなくなる
    // 透過と不透明度は下地のスライドと重なるときだけ意味がある
    const overlaid = composing && !split;
    sc.sub.style.mixBlendMode = overlaid && slideStream ? cfg.blend : 'normal';
    sc.sub.style.opacity = overlaid ? cfg.subOpacity : 1;
    // 全画面で字幕を出している間はカーソルを聴衆に見せない
    sc.root.style.cursor = sc.doc.fullscreenElement && composing ? 'none' : '';
  }
  return box;
}

const ctl = makeScene(document, stage, false);
const scenes = () => (out ? [ctl, out.scene] : [ctl]);
addStyle(document, SCENE_CSS);

function layout() {
  // スライドショーは聴衆側ディスプレイを全面で覆うので、縦横比をスライドに合わせれば出力と配置が一致する
  const ratio = ctl.slide.videoWidth ? ctl.slide.videoWidth / ctl.slide.videoHeight : 16 / 9;
  stage.style.aspectRatio = ratio;
  // 下の操作パネルが画面外へ押し出されない高さに収める
  stage.style.maxWidth = `min(1100px, ${55 * ratio}vh)`;
  const box = layoutScene(ctl);
  gizmo.style.display = url ? 'block' : 'none';
  const sp = currentSplit();
  gizmo.classList.toggle('split', !!sp);
  const div = $('divider');
  div.hidden = !sp;
  if (sp) {
    const at = (sp.subFirst ? cfg.band : 1 - cfg.band) * 100 + '%';
    div.className = sp.axis === 'x' ? 'v' : 'h';
    div.style.left = sp.axis === 'x' ? at : '';
    div.style.top = sp.axis === 'x' ? '' : at;
  }
  for (const k in box) gizmo.style[k] = box[k] + 'px';
  if (out) layoutScene(out.scene);
  // 合わせた結果は、出力を全画面にするなど画面の形が変わると合わなくなる。勝手に合わせ直しはせず、ずれていることだけを出し続ける
  const goal = fitGoal();
  $('fitNote').textContent = goal && Math.abs(goal.wanted - cfg.fh) >= 1
    ? `いま${goal.onOutput ? '出力側' : 'プレビュー'}の字幕の領域に余白があります(窓の高さを ${Math.round(goal.wanted)}px にすると合う)。`
    : '';
  $('note').textContent = !url ? '「ソース」に CoeFont の招待URLを貼って読み込む'
    : !slideStream ? 'スライド未選択(聴衆には黒い背景に字幕だけが見える)' : '';
}
new ResizeObserver(layout).observe(stage);

function render() {
  normalize();
  $('blend').value = cfg.blend;
  $('subOpacity').value = cfg.subOpacity * 100;
  $('oOpacity').textContent = Math.round(cfg.subOpacity * 100) + '%';
  for (const { input, output, key } of WINDOW_SLIDERS) {
    $(input).value = cfg[key];
    $(output).textContent = Math.round(cfg[key]) + 'px';
  }
  const split = isSplit();
  $('bandLabel').textContent = currentSplit()?.axis === 'x' ? '字幕の領域の幅' : '字幕の領域の高さ';
  $('layoutSel').value = cfg.layout;
  $('band').value = cfg.band * 100;
  $('oBand').textContent = Math.round(cfg.band * 100) + '%';
  for (const id of ['rowBand', 'btnFit']) $(id).hidden = !split;
  for (const id of ['rowBlend', 'rowOpacity', 'btnResetPos']) $(id).hidden = split;
  $('gizmoLabel').textContent = '字幕(実物は出力側に表示)';
  $('gizmoHint').textContent = split
    ? 'プレビュー: 赤い線をドラッグでスライドと字幕の境界。字幕の枠の青い辺で切り抜き(境界を動かしても切り抜きは変わらない)。'
    : 'プレビューの字幕の枠: 中をドラッグで移動、赤い角で拡大縮小、青い辺で切り抜き。';
  const fullLabel = full ? '字幕表示に戻す' : 'CoeFont の画面全体を表示';
  $('btnFull').textContent = '出力側: ' + fullLabel;
  $('btnFull').disabled = !out;
  if (out) out.fullBtn.textContent = fullLabel;
  $('dotSub').classList.toggle('on', !!url);
  $('dotSlide').classList.toggle('on', !!slideStream);
  $('dotOut').classList.toggle('on', !!out);
  $('outState').textContent = out ? '出力ウィンドウ: 表示中' : '出力ウィンドウ: 未表示';
  $('btnOut').textContent = out ? '出力ウィンドウを前面に出す' : '出力ウィンドウを開く';
  $('btnSlide').textContent = slideStream ? '変更' : '選択';
  $('stopSlide').disabled = !slideStream;
  layout();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 300);
}

// ドラッグ中は pointermove のたびに render が走る。そのつど同期的に書き込むと操作が重くなるので、動きが止まってからまとめて保存する
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch {}
}

function attach(video, s) {
  video.srcObject = s;
  if (s) video.play().catch(() => {});
}

// --- 出力ウィンドウ ---
function openOutput() {
  if (out && !out.win.closed) {
    out.win.focus();
    return out;
  }
  const win = window.open('', 'coefont-output', 'popup,width=960,height=540');
  if (!win) {
    setStatus('出力ウィンドウがブロックされました。アドレスバーの表示からこのサイトのポップアップを許可してください。', 'error');
    return null;
  }
  const doc = win.document;
  doc.title = '字幕出力';
  doc.head.innerHTML = '';
  doc.body.innerHTML = '';
  addStyle(doc, SCENE_CSS + OUTPUT_CSS);
  const root = doc.createElement('div');
  root.id = 'root';
  const bar = doc.createElement('div');
  bar.id = 'bar';
  const go = doc.createElement('button');
  go.textContent = '全画面にする';
  const fullBtn = doc.createElement('button');
  fullBtn.className = 'sub';
  bar.append('聴衆側ディスプレイへ移動してから →', go, '(Esc で解除)', fullBtn);
  doc.body.append(root, bar);

  const self = { win, fullBtn, scene: makeScene(doc, root, true) };
  out = self;
  if (url) self.scene.content.src = url;
  attach(self.scene.slide, slideStream);
  go.addEventListener('click', () => {
    // 全体表示のまま聴衆に出してしまわないよう、全画面にするときは字幕表示へ戻す
    full = false;
    render();
    doc.documentElement.requestFullscreen().catch(() => {});
  });
  fullBtn.addEventListener('click', toggleFull);
  doc.addEventListener('fullscreenchange', () => {
    bar.style.display = doc.fullscreenElement ? 'none' : '';
    layout();
  });
  win.addEventListener('resize', layout);
  win.addEventListener('pagehide', () => {
    if (out !== self) return;
    out = null;
    full = false;
    render();
    setStatus('出力ウィンドウが閉じられました。「出力ウィンドウを開く」で開き直せます(CoeFont は読み込み直しになります)。', 'warn');
  });
  render();
  return self;
}

// --- ソース ---
// CoeFontはタブ共有で取り込まず、ページそのものを埋め込む。タブ共有を使うと、共有中はChromeが
// 同じプロファイルの全タブ(出力ウィンドウを含む)に「共有しています」バーを出し、ページ側から消せないため
function loadUrl() {
  let u;
  try { u = new URL($('url').value.trim()); } catch {}
  if (!u || u.protocol !== 'https:') {
    setStatus('CoeFont の招待URL(https://〜)を貼ってください。', 'warn');
    return;
  }
  url = u.href;
  try { sessionStorage.setItem(URL_KEY, url); } catch {}
  const o = openOutput();
  if (!o) return;
  o.scene.content.src = url;
  render();
  setStatus('別のウィンドウ(またはタブ)に出力を開きました。そこに CoeFont の画面がそのまま出ているので、開始や設定を済ませてください。そのあと、プレビューの枠の青い辺で字幕以外を切り落とします。\n別のタブでも同じ招待URLを開いていると音声が二重に鳴るので、そちらは閉じてください。');
}

function setSlide(s) {
  if (slideStream) slideStream.getTracks().forEach((t) => { t.onended = null; t.stop(); });
  slideStream = s;
  attach(ctl.slide, s);
  if (out) attach(out.scene.slide, s);
  render();
}

async function pickSlide() {
  let s;
  try {
    s = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface: 'window', frameRate: { ideal: 30 } },
      audio: false,
      selfBrowserSurface: 'exclude',
      // 画面全体を選ぶと、全画面にした出力ウィンドウ自身が映り込んで合わせ鏡になる
      monitorTypeSurfaces: 'exclude',
    });
  } catch (e) {
    if (e.name === 'NotAllowedError') {
      setStatus('ウィンドウの選択がキャンセル(または拒否)されました。\nmacOSで毎回失敗する場合は、システム設定 > プライバシーとセキュリティ > 画面収録 でブラウザを許可してください。', 'warn');
    } else {
      setStatus(`スライドを取得できませんでした: ${e.name}: ${e.message}`, 'error');
    }
    return;
  }
  setSlide(s);
  const track = s.getVideoTracks()[0];
  track.onended = () => {
    setSlide(null);
    setStatus('スライドの画面共有が終了しました。ソースの「選択」で再接続できます。', 'warn');
  };
  const surface = track.getSettings().displaySurface;
  if (surface === 'browser') {
    setStatus('タブが選ばれています。タブを共有すると Chrome の「共有しています」バーが出力ウィンドウにも出ます。選択画面の「ウィンドウ」からスライドショーを選び直してください。', 'warn');
  } else if (surface === 'monitor') {
    setStatus('画面全体が選ばれています。出力ウィンドウと同じディスプレイだと合わせ鏡になるので、スライドショーの「ウィンドウ」を選び直してください。', 'warn');
  } else {
    setStatus('スライドを取得中。プレビューで字幕の位置を決めてください。');
  }
}

// 掴んでいる間は出し続け、離したあとも位置を見届けられるよう少しだけ残す
function markAdjusting(holding) {
  adjusting = true;
  clearTimeout(adjustTimer);
  if (!holding) adjustTimer = setTimeout(() => { adjusting = false; layout(); }, 1500);
}

// 切り抜いた残りが字幕の領域と同じ縦横比になる窓の高さ。並べる配置でなければ null。
// 聴衆が見るのは出力側なので、開いていればその画面の形を基準にする(手元のプレビューとは縦横比が違うことがある)
function fitGoal() {
  const onOutput = !!(out && out.scene.root.clientWidth && out.scene.root.clientHeight);
  const root = onOutput ? out.scene.root : stage;
  const r = regions(root.clientWidth, root.clientHeight);
  if (!r) return null;
  return { onOutput, wanted: cfg.it + cfg.ib + (cfg.fw - cfg.il - cfg.ir) * r.sub.height / r.sub.width };
}

// 窓の形を変えるのは利用者が押したときだけ。切り抜きには触らない
function fitWindow() {
  const goal = fitGoal();
  if (!goal) return;
  cfg.fh = goal.wanted;
  markAdjusting(false);
  render();
  const size = `${Math.round(cfg.fw)}×${Math.round(cfg.fh)}px`;
  if (Math.abs(cfg.fh - goal.wanted) >= 0.5) {
    setStatus(`窓の高さを ${Math.round(goal.wanted)}px にすると合いますが、指定できる範囲(${WIN_H_RANGE[0]}〜${WIN_H_RANGE[1]}px)の外です。${size} で止めました。窓の幅か、字幕の領域の大きさを変えてからもう一度押してください。`, 'warn');
  } else {
    setStatus(`CoeFont の窓を ${size} にして、${goal.onOutput ? '出力側の今の画面' : 'プレビュー'}の形に合わせました。`);
  }
}

function toggleFull() {
  full = !full;
  render();
}

// --- 字幕の枠を直接つかむ: 中=移動、角(赤)=拡大縮小、辺(青)=切り抜き ---
let grab = null;
gizmo.addEventListener('pointerdown', (e) => {
  // 並べる配置で掴めるのは切り抜きの辺だけ。枠の中を押しても動かせないので、調整中の扱い(出力側の枠線)にもしない
  if (isSplit() && !e.target.dataset.c) return;
  grab = {
    handle: e.target.dataset.h || '', edge: e.target.dataset.c || '', px: e.clientX, py: e.clientY,
    start: { ...cfg },
    W: stage.clientWidth, H: stage.clientHeight,
    l: gizmo.offsetLeft, t: gizmo.offsetTop, w: gizmo.offsetWidth, h: gizmo.offsetHeight,
  };
  gizmo.setPointerCapture(e.pointerId);
  e.preventDefault();
  markAdjusting(true);
  if (grab.edge && isSplit()) for (const sc of scenes()) sc.frozen = sc.origin;
  layout();
});
gizmo.addEventListener('pointermove', (e) => {
  if (!grab) return;
  const { handle, edge, start, W, H, l, t, w, h } = grab;
  const dx = e.clientX - grab.px, dy = e.clientY - grab.py;
  if (edge) {
    // 拡大率を変えず、つかんだ辺だけがマウスに付いてくるようにする。反対側の切り抜きを越えない範囲で止めるので、
    // 掴んでいない辺の切り抜きには影響しない
    const cw = start.fw - start.il - start.ir, ch = start.fh - start.it - start.ib;
    const scale = w / cw;
    // 重ねる配置では枠の幅に下限があり、それを割ると拡大率のほうが変わって掴んだ辺が付いてこなくなるので、その手前で止める
    const minW = isSplit() ? MIN_PX : Math.max(MIN_PX, MIN_SUB_W * W / scale);
    let d;
    if (edge === 't') {
      d = clamp(dy / scale, -start.it, ch - MIN_PX);
      cfg.it = start.it + d;
    } else if (edge === 'b') {
      d = clamp(dy / scale, -(ch - MIN_PX), start.ib);
      cfg.ib = start.ib - d;
    } else if (edge === 'l') {
      d = clamp(dx / scale, -start.il, cw - minW);
      cfg.il = start.il + d;
    } else {
      d = clamp(dx / scale, -(cw - minW), start.ir);
      cfg.ir = start.ir - d;
    }
    // 重ねる配置は枠の位置と幅を設定として持っているので、中身と反対側の辺が動かないよう合わせて直す。
    // 並べる配置は掴んでいる間の収め直しを止めてあるので、切り抜きを変えるだけでよい
    if (!isSplit()) {
      if (edge === 't') cfg.subY = start.subY + d * scale / H;
      else if (edge === 'l') { cfg.subX = start.subX + d * scale / W; cfg.subW = (cw - d) * scale / W; }
      else if (edge === 'r') cfg.subW = (cw + d) * scale / W;
    }
  } else if (!handle) {
    cfg.subX = (l + dx) / W;
    cfg.subY = (t + dy) / H;
  } else {
    // 縦横比は字幕の範囲で決まるので幅だけ動かし、掴んだ角の対角を固定する
    const nw = clamp(handle.includes('w') ? w - dx : w + dx, W * 0.1, W);
    const nh = nw * h / w;
    cfg.subW = nw / W;
    cfg.subX = (handle.includes('w') ? l + w - nw : l) / W;
    cfg.subY = (handle.includes('n') ? t + h - nh : t) / H;
  }
  render();
});
for (const ev of ['pointerup', 'pointercancel']) gizmo.addEventListener(ev, () => {
  if (!grab) return;
  grab = null;
  // 離したら、新しい切り抜きで領域に収め直す
  for (const sc of scenes()) sc.frozen = null;
  markAdjusting(false);
  layout();
});

// --- 並べる配置: スライドと字幕の境界線 ---
const divider = $('divider');
let dividing = false;
divider.addEventListener('pointerdown', (e) => {
  dividing = true;
  divider.setPointerCapture(e.pointerId);
  e.preventDefault();
  markAdjusting(true);
});
divider.addEventListener('pointermove', (e) => {
  if (!dividing) return;
  const sp = currentSplit();
  if (!sp) return;
  const r = stage.getBoundingClientRect();
  const f = sp.axis === 'x' ? (e.clientX - r.left) / r.width : (e.clientY - r.top) / r.height;
  cfg.band = sp.subFirst ? f : 1 - f;
  render();
});
for (const ev of ['pointerup', 'pointercancel']) divider.addEventListener(ev, () => { dividing = false; markAdjusting(false); });

// --- 操作 ---
const actions = {
  loadUrl, pickSlide, openOutput, toggleFull, fitWindow,
  stopSlide: () => { setSlide(null); setStatus('スライドの共有を停止しました。'); },
  resetCrop: () => { Object.assign(cfg, CROP_DEFAULTS); render(); },
  resetWindow: () => { Object.assign(cfg, WINDOW_DEFAULTS); render(); },
  resetPos: () => { Object.assign(cfg, POS_DEFAULTS); render(); },
};
document.addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act) actions[act]();
});
$('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadUrl(); });
$('blend').addEventListener('change', (e) => { cfg.blend = e.target.value; render(); });
$('layoutSel').addEventListener('change', (e) => { cfg.layout = e.target.value; markAdjusting(false); render(); });
$('band').addEventListener('input', (e) => { markAdjusting(false); cfg.band = e.target.value / 100; render(); });
for (const { input, key, range, name } of WINDOW_SLIDERS) {
  [$(input).min, $(input).max] = range;
  $(input).addEventListener('input', (e) => {
    const asked = +e.target.value;
    markAdjusting(false);
    cfg[key] = asked;
    render();
    // 切り抜きを守るために窓が縮まなかったとき、つまみが戻るだけだと故障に見えるので理由を出す
    if (cfg[key] > asked) setStatus(`切り抜きで残している範囲が収まらなくなるため、窓の${name}は ${Math.round(cfg[key])}px より小さくできません。もっと小さくするには、先に切り抜きを減らしてください。`, 'warn');
  });
}
$('layoutSel').append(new Option(OVERLAY_LABEL, 'overlay'), ...Object.entries(SPLITS).map(([value, { label }]) => new Option(label, value)));
$('subOpacity').addEventListener('input', (e) => { cfg.subOpacity = e.target.value / 100; render(); });
// このタブを閉じると出力ウィンドウを操作できなくなるので道連れにする
window.addEventListener('pagehide', () => {
  save();
  if (out) out.win.close();
});

// --- 環境判定 ---
if (!navigator.mediaDevices?.getDisplayMedia) {
  setStatus(window.isSecureContext
    ? 'このブラウザはスライドの取り込み(画面共有)に対応していません。デスクトップ版の Chrome / Edge を使ってください。'
    : 'このページは HTTPS(または localhost)で開く必要があります。', 'error');
  $('btnSlide').disabled = true;
} else {
  setStatus('① CoeFont の招待URLを読み込む(出力が別ウィンドウかタブで開く) → ② 出力側で CoeFont を開始・設定 → ③ 青い辺で字幕以外を切り落とす → ④ スライドショーのウィンドウを選択 → ⑤ 出力を聴衆側ディスプレイで全画面にする');
}

// 再読み込みで貼り直さずに済むよう、タブを閉じるまでだけURLを覚えておく(招待URLを長く残さない)
try { $('url').value = sessionStorage.getItem(URL_KEY) || ''; } catch {}
// 配信側が10分キャッシュするので、古い版を見ていないか利用者が確かめられるようにする
$('build').textContent = '配信日時: ' + document.lastModified;

render();
</script>
</body>
</html>
