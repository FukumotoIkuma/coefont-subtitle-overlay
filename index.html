<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoeFont Subtitle Overlay</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; font: 13px/1.5 system-ui, sans-serif; background: #16181c; color: #e6e6e6; }
  h2 { font-size: 12px; font-weight: 600; margin: 0 0 6px; color: #bbb; }
  h2 small { font-weight: 400; color: #888; margin-left: 8px; }
  button { font: inherit; padding: 6px 12px; border-radius: 5px; border: 1px solid #444; background: #2a2d33; color: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: #343840; }
  button.primary { background: #2f6feb; border-color: #2f6feb; color: #fff; }
  button.primary:hover:not(:disabled) { background: #4380f0; }
  button.big { padding: 10px 14px; width: 100%; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  select { font: inherit; padding: 4px; }
  #status { padding: 6px 10px; border-radius: 5px; background: #22252b; margin-bottom: 10px; white-space: pre-line; }
  #status.error { background: #4a1f1f; }
  #status.warn { background: #4a3d1f; }
  .hint { color: #999; font-size: 12px; }
  [hidden] { display: none !important; }

  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .docks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  @media (max-width: 900px) { .panes, .docks { grid-template-columns: 1fr; } }
  .dock { background: #1e2126; border: 1px solid #2c3037; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .name { flex: 1; }
  .row input[type=range] { flex: 1; min-width: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex: none; }
  .dot.on { background: #3fb950; }

  .view { position: relative; overflow: hidden; background: #000; border-radius: 6px; user-select: none; touch-action: none; }
  .empty { position: absolute; left: 0; right: 0; top: 30%; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 0 12px; }

  #stage { cursor: crosshair; }
  #stage video { display: block; width: 100%; }
  #stage:not(.live) { aspect-ratio: 16 / 9; cursor: default; }
  /* 選択範囲外を暗くするのに巨大なbox-shadowを使う(親のoverflow:hiddenで切る) */
  #sel { position: absolute; border: 2px solid #2f6feb; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .55); pointer-events: none; display: none; }
  #stage.live #sel { display: block; }

  #canvas { aspect-ratio: 16 / 9; }
  #slideView { position: absolute; inset: 0; width: 100%; height: 100%; }
  #subBox { position: absolute; overflow: hidden; }
  #subView { position: absolute; max-width: none; }
  #gizmo { position: absolute; border: 2px solid #e5484d; cursor: move; display: none; }
  #gizmo i { position: absolute; width: 12px; height: 12px; background: #e5484d; }
  #gizmo i[data-h=nw] { left: -7px; top: -7px; cursor: nwse-resize; }
  #gizmo i[data-h=se] { right: -7px; bottom: -7px; cursor: nwse-resize; }
  #gizmo i[data-h=ne] { right: -7px; top: -7px; cursor: nesw-resize; }
  #gizmo i[data-h=sw] { left: -7px; bottom: -7px; cursor: nesw-resize; }

  #build { margin-top: 10px; text-align: right; }
  /* display:noneだと動画PiPの元として再生されないことがあるので見えない大きさで置く */
  #pipVideo { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="status"></div>

<div class="panes">
  <section>
    <h2>入力: CoeFont<small>ドラッグで字幕の範囲を囲む</small></h2>
    <div id="stage" class="view">
      <video id="preview" muted playsinline autoplay></video>
      <div id="sel"></div>
      <div class="empty" id="emptySub">
        <button class="primary" data-act="pickSub">CoeFont のタブを選択</button>
        <div class="hint">CoeFont の通訳画面を別タブで開いておく</div>
      </div>
    </div>
  </section>
  <section>
    <h2>聴衆側の画面<small>背景を透過するときだけ使う。赤枠=小窓を置く場所</small></h2>
    <div id="canvas" class="view">
      <video id="slideView" muted playsinline autoplay></video>
      <div id="subBox"><video id="subView" muted playsinline autoplay></video></div>
      <div id="gizmo"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div>
      <div class="empty" id="emptySlide">
        <button data-act="pickSlide">スライドショーのウィンドウを選択</button>
        <div class="hint">透過しないなら不要。使うときは先にスライドショーを開始しておく</div>
      </div>
    </div>
  </section>
</div>

<div class="docks">
  <div class="dock">
    <h2>ソース</h2>
    <div class="row"><span class="dot" id="dotSub"></span><span class="name">字幕(CoeFont のタブ)</span>
      <button data-act="pickSub" id="btnSub">選択</button><button data-act="stopSub" id="stopSub">停止</button></div>
    <div class="row"><span class="dot" id="dotSlide"></span><span class="name">スライド(透過用・任意)</span>
      <button data-act="pickSlide" id="btnSlide">選択</button><button data-act="stopSlide" id="stopSlide">停止</button></div>
  </div>

  <div class="dock">
    <h2>字幕の見た目</h2>
    <div class="row"><label for="blend">背景の透過</label>
      <select id="blend">
        <option value="source-over">なし</option>
        <option value="multiply">白地を抜く(暗い文字用)</option>
        <option value="screen">黒地を抜く(明るい文字用)</option>
      </select></div>
    <div class="row"><label for="subOpacity">不透明度</label><input type="range" id="subOpacity" min="20" max="100"><output id="oOpacity"></output></div>
    <div class="hint" id="blendHint">透過と不透明度は、スライドのソースを選ぶと効きます。</div>
    <div class="row"><button data-act="resetCrop">切り抜きを初期化</button><button data-act="resetPos">配置を初期化</button></div>
  </div>

  <div class="dock">
    <h2>出力</h2>
    <button class="big primary" data-act="showPip" id="showPip">字幕の小窓を出す</button>
    <div class="hint">小窓は常に最前面。聴衆側ディスプレイへドラッグして置く。<br>透過を使うときは、小窓を赤枠と同じ位置・大きさに置く。継ぎ目がずれて見えたら赤枠のほうを動かして合わせる。</div>
  </div>
</div>

<video id="pipVideo" muted playsinline autoplay></video>
<div class="hint" id="build"></div>

<script>
const $ = (id) => document.getElementById(id);
const STORE_KEY = 'coefont-subtitle-overlay';
const CROP_DEFAULTS = { x: 0, y: 0.62, w: 1, h: 0.38 };
const POS_DEFAULTS = { subX: 0.1, subY: 0.76, subW: 0.8 };
const DEFAULTS = { ...CROP_DEFAULTS, ...POS_DEFAULTS, subOpacity: 1, blend: 'source-over' };
const BLENDS = ['source-over', 'multiply', 'screen'];
const MIN = 0.02;

let cfg = { ...DEFAULTS };
try { Object.assign(cfg, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}

const preview = $('preview');
const stage = $('stage');
const canvasEl = $('canvas');
const slideView = $('slideView');
const subBox = $('subBox');
const subView = $('subView');
const gizmo = $('gizmo');
const pipVideo = $('pipVideo');
const supported = !!(window.MediaStreamTrackProcessor && window.MediaStreamTrackGenerator && window.OffscreenCanvas && document.pictureInPictureEnabled);
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), Math.max(lo, hi));

function setStatus(text, kind = '') {
  $('status').textContent = text;
  $('status').className = kind;
}

function attach(video, s) {
  video.srcObject = s;
  if (s) video.play().catch(() => {});
}

// --- 小窓に流す映像の合成 ---
// 出力先を動画PiPに限っているのは、通常のブラウザ窓だとChromeの「共有中」バーが全画面でも出て、
// Document PiPだとURLの帯が出るため。動画PiPは1本の映像しか映せないので、ここで1本に合成する。
const sources = {
  sub: { stream: null, frame: null, abort: null },
  slide: { stream: null, frame: null, abort: null },
};
const mixer = supported ? new OffscreenCanvas(2, 2) : null;
const mixCtx = mixer?.getContext('2d');
// 小窓を開いたまま再接続できるよう、出力トラックはページの寿命のあいだ1本を使い回す
const outTrack = supported ? new MediaStreamTrackGenerator({ kind: 'video' }) : null;
const outWriter = outTrack?.writable.getWriter();
if (supported) attach(pipVideo, new MediaStream([outTrack]));

function draw() {
  const sub = sources.sub.frame, slide = sources.slide.frame;
  if (!sub) return;
  const sx = cfg.x * sub.displayWidth, sy = cfg.y * sub.displayHeight;
  const sw = cfg.w * sub.displayWidth, sh = cfg.h * sub.displayHeight;
  // 映像の符号化は奇数サイズを扱えないことがあるので偶数に丸める
  const W = Math.max(2, Math.round(sw / 2) * 2), H = Math.max(2, Math.round(sh / 2) * 2);
  if (mixer.width !== W || mixer.height !== H) { mixer.width = W; mixer.height = H; }
  mixCtx.globalCompositeOperation = 'source-over';
  mixCtx.globalAlpha = 1;
  mixCtx.fillStyle = '#000';
  mixCtx.fillRect(0, 0, W, H);
  if (slide) {
    // 窓そのものは透過できないので、小窓の真裏にあるはずのスライドを下地に描いて透けて見せる
    const rw = cfg.subW * slide.displayWidth;
    mixCtx.drawImage(slide, cfg.subX * slide.displayWidth, cfg.subY * slide.displayHeight, rw, rw * sh / sw, 0, 0, W, H);
    mixCtx.globalCompositeOperation = cfg.blend;
    mixCtx.globalAlpha = cfg.subOpacity;
  }
  mixCtx.drawImage(sub, sx, sy, sw, sh, 0, 0, W, H);
  const frame = new VideoFrame(mixer, { timestamp: performance.now() * 1000 });
  outWriter.write(frame).catch(() => {}).finally(() => frame.close());
}

// タイマーやrequestAnimationFrameで描くとこのタブが裏に回った時に間引かれるので、フレームの到着で駆動する
async function pump(src) {
  const ac = new AbortController();
  src.abort = ac;
  const reader = new MediaStreamTrackProcessor({ track: src.stream.getVideoTracks()[0] }).readable.getReader();
  ac.signal.addEventListener('abort', () => reader.cancel().catch(() => {}));
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done || ac.signal.aborted) { value?.close(); break; }
      src.frame?.close();
      src.frame = value;
      draw();
    }
  } catch {}
}

function setSource(key, s) {
  const src = sources[key];
  if (src.stream) src.stream.getTracks().forEach((t) => { t.onended = null; t.stop(); });
  src.abort?.abort();
  src.frame?.close();
  src.frame = null;
  src.stream = s;
  if (key === 'sub') { attach(preview, s); attach(subView, s); } else { attach(slideView, s); }
  if (s && supported) pump(src);
  draw();
  layoutPreview();
  updateUI();
}

// --- 画面 ---
function layoutPreview() {
  // スライドショーは聴衆側ディスプレイを全面で覆うので、プレビューの縦横比をスライドに合わせれば座標がそのまま対応する
  canvasEl.style.aspectRatio = slideView.videoWidth ? `${slideView.videoWidth} / ${slideView.videoHeight}` : '';
  const vw = subView.videoWidth, vh = subView.videoHeight;
  const shown = !!(vw && vh);
  subBox.style.display = shown ? '' : 'none';
  gizmo.style.display = shown ? 'block' : 'none';
  if (!shown) return;
  const W = canvasEl.clientWidth;
  const scale = W * cfg.subW / (cfg.w * vw);
  const box = { left: cfg.subX * W, top: cfg.subY * canvasEl.clientHeight, width: cfg.w * vw * scale, height: cfg.h * vh * scale };
  // 枠線に合成モードが掛からないよう、操作用の枠は字幕と別要素にして同じ位置へ重ねる
  for (const k in box) subBox.style[k] = gizmo.style[k] = box[k] + 'px';
  subView.style.width = vw * scale + 'px';
  subView.style.height = vh * scale + 'px';
  subView.style.left = -cfg.x * vw * scale + 'px';
  subView.style.top = -cfg.y * vh * scale + 'px';
  subBox.style.mixBlendMode = cfg.blend === 'source-over' ? 'normal' : cfg.blend;
  subBox.style.opacity = cfg.subOpacity;
}
for (const v of [subView, slideView]) for (const ev of ['loadedmetadata', 'resize', 'emptied']) v.addEventListener(ev, layoutPreview);
new ResizeObserver(layoutPreview).observe(canvasEl);

function normalize() {
  cfg.x = clamp(cfg.x, 0, 1 - MIN);
  cfg.y = clamp(cfg.y, 0, 1 - MIN);
  cfg.w = clamp(cfg.w, MIN, 1 - cfg.x);
  cfg.h = clamp(cfg.h, MIN, 1 - cfg.y);
  cfg.subW = clamp(cfg.subW, 0.1, 1);
  cfg.subX = clamp(cfg.subX, 0, 1 - cfg.subW);
  cfg.subY = clamp(cfg.subY, 0, 0.98);
  if (!BLENDS.includes(cfg.blend)) cfg.blend = DEFAULTS.blend;
}

function render() {
  normalize();
  const sel = $('sel');
  sel.style.left = cfg.x * 100 + '%';
  sel.style.top = cfg.y * 100 + '%';
  sel.style.width = cfg.w * 100 + '%';
  sel.style.height = cfg.h * 100 + '%';
  $('blend').value = cfg.blend;
  $('subOpacity').value = cfg.subOpacity * 100;
  $('oOpacity').textContent = Math.round(cfg.subOpacity * 100) + '%';
  layoutPreview();
  if (supported) draw();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch {}
}

function updateUI() {
  const sub = !!sources.sub.stream, slide = !!sources.slide.stream;
  stage.classList.toggle('live', sub);
  $('emptySub').hidden = sub;
  $('emptySlide').hidden = slide;
  $('dotSub').classList.toggle('on', sub);
  $('dotSlide').classList.toggle('on', slide);
  $('btnSub').textContent = sub ? '変更' : '選択';
  $('btnSlide').textContent = slide ? '変更' : '選択';
  $('stopSub').disabled = !sub;
  $('stopSlide').disabled = !slide;
  $('blendHint').hidden = slide;
  $('showPip').disabled = !sub;
  $('showPip').textContent = document.pictureInPictureElement === pipVideo ? '字幕の小窓を開き直す' : '字幕の小窓を出す';
}

// --- ソースの選択 ---
async function capture(video) {
  try {
    // surfaceSwitchingを許可すると「代わりにこのタブを共有」のボタンが無関係なタブにまで出る。共有先の切り替えはソースの「変更」で足りる
    return await navigator.mediaDevices.getDisplayMedia({ video, audio: false, selfBrowserSurface: 'exclude', surfaceSwitching: 'exclude' });
  } catch (e) {
    if (e.name === 'NotAllowedError') {
      setStatus('画面の選択がキャンセル(または拒否)されました。\nmacOSで毎回失敗する場合は、システム設定 > プライバシーとセキュリティ > 画面収録 でブラウザを許可してください。', 'warn');
    } else {
      setStatus(`画面を取得できませんでした: ${e.name}: ${e.message}`, 'error');
    }
    return null;
  }
}

async function pickSub() {
  const s = await capture({ frameRate: { ideal: 15, max: 30 } });
  if (!s) return;
  setSource('sub', s);
  const track = s.getVideoTracks()[0];
  track.onended = () => {
    setSource('sub', null);
    setStatus('字幕の画面共有が終了しました。ソースの「選択」で再接続できます(小窓は開いたままで構いません)。', 'warn');
  };
  const isTab = track.getSettings().displaySurface === 'browser';
  setStatus(isTab
    ? '字幕を取得中。左で字幕の範囲を囲んで「字幕の小窓を出す」を押してください。'
    : '字幕を取得中(タブ以外を共有しています。CoeFontのタブを選ぶと、裏に回っても更新が止まりにくくなります)。',
    isTab ? '' : 'warn');
}

async function pickSlide() {
  const s = await capture({ frameRate: { ideal: 30 } });
  if (!s) return;
  setSource('slide', s);
  const track = s.getVideoTracks()[0];
  track.onended = () => {
    setSource('slide', null);
    setStatus('スライドの画面共有が終了しました。透過は止まり、字幕は不透明で出続けます。ソースの「選択」で再接続できます。', 'warn');
  };
  // 画面全体を選ぶと小窓自身が映り込み、下地に字幕が焼き付いて重なっていく
  const isMonitor = track.getSettings().displaySurface === 'monitor';
  setStatus(isMonitor
    ? '画面全体が選ばれています。小窓自身が映り込むので、スライドショーの「ウィンドウ」を選び直してください。'
    : 'スライドを取得中。「背景の透過」を選び、右の赤枠で小窓を置く場所を決めてください。',
    isMonitor ? 'warn' : '');
}

async function showPip() {
  try {
    await pipVideo.requestPictureInPicture();
  } catch (e) {
    setStatus(e.name === 'InvalidStateError'
      ? 'まだ映像が届いていません。CoeFont側の画面が一度更新されてからもう一度押してください。'
      : `小窓を開けませんでした: ${e.name}: ${e.message}`, 'error');
  }
}

// --- 入力側: 切り抜き範囲をドラッグで囲む ---
let cropStart = null;
const fracIn = (el, e) => {
  const r = el.getBoundingClientRect();
  return { x: clamp((e.clientX - r.left) / r.width, 0, 1), y: clamp((e.clientY - r.top) / r.height, 0, 1) };
};
stage.addEventListener('pointerdown', (e) => {
  if (!sources.sub.stream) return;
  cropStart = fracIn(stage, e);
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', (e) => {
  if (!cropStart) return;
  const p = fracIn(stage, e);
  // クリックだけで極小の範囲になるのを避ける
  if (Math.abs(p.x - cropStart.x) < MIN || Math.abs(p.y - cropStart.y) < MIN) return;
  cfg.x = Math.min(p.x, cropStart.x);
  cfg.y = Math.min(p.y, cropStart.y);
  cfg.w = Math.abs(p.x - cropStart.x);
  cfg.h = Math.abs(p.y - cropStart.y);
  render();
});
for (const ev of ['pointerup', 'pointercancel']) stage.addEventListener(ev, () => { cropStart = null; });

// --- 聴衆側の画面: 小窓を置く場所(赤枠)の移動と拡大縮小 ---
let grab = null;
gizmo.addEventListener('pointerdown', (e) => {
  grab = {
    handle: e.target.dataset.h || '', px: e.clientX, py: e.clientY,
    W: canvasEl.clientWidth, H: canvasEl.clientHeight,
    l: gizmo.offsetLeft, t: gizmo.offsetTop, w: gizmo.offsetWidth, h: gizmo.offsetHeight,
  };
  gizmo.setPointerCapture(e.pointerId);
  e.preventDefault();
});
gizmo.addEventListener('pointermove', (e) => {
  if (!grab) return;
  const { handle, W, H, l, t, w, h } = grab;
  const dx = e.clientX - grab.px, dy = e.clientY - grab.py;
  if (!handle) {
    cfg.subX = (l + dx) / W;
    cfg.subY = (t + dy) / H;
  } else {
    // 縦横比は切り抜き範囲で決まるので幅だけ動かし、掴んだ角の対角を固定する
    const nw = clamp(handle.includes('w') ? w - dx : w + dx, W * 0.1, W);
    const nh = nw * h / w;
    cfg.subW = nw / W;
    cfg.subX = (handle.includes('w') ? l + w - nw : l) / W;
    cfg.subY = (handle.includes('n') ? t + h - nh : t) / H;
  }
  render();
});
for (const ev of ['pointerup', 'pointercancel']) gizmo.addEventListener(ev, () => { grab = null; });

// --- 操作 ---
const actions = {
  pickSub, pickSlide, showPip,
  stopSub: () => { setSource('sub', null); setStatus('字幕の共有を停止しました。'); },
  stopSlide: () => { setSource('slide', null); setStatus('スライドの共有を停止しました。'); },
  resetCrop: () => { Object.assign(cfg, CROP_DEFAULTS); render(); },
  resetPos: () => { Object.assign(cfg, POS_DEFAULTS); render(); },
};
document.addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act) actions[act]();
});
$('blend').addEventListener('change', (e) => { cfg.blend = e.target.value; render(); });
$('subOpacity').addEventListener('input', (e) => { cfg.subOpacity = e.target.value / 100; render(); });
pipVideo.addEventListener('enterpictureinpicture', updateUI);
pipVideo.addEventListener('leavepictureinpicture', updateUI);

// --- 環境判定 ---
if (!window.isSecureContext) {
  setStatus('このページは HTTPS(または localhost)で開く必要があります。', 'error');
} else if (!navigator.mediaDevices?.getDisplayMedia || !supported) {
  setStatus('このブラウザでは使えません(画面共有、または映像の合成と小窓表示に必要な機能がありません)。デスクトップ版の Chrome / Edge を使ってください。', 'error');
} else {
  setStatus('CoeFont のタブを選び、字幕の範囲を囲んでから「字幕の小窓を出す」を押します。');
}
if (!window.isSecureContext || !navigator.mediaDevices?.getDisplayMedia || !supported) {
  document.querySelectorAll('[data-act^=pick]').forEach((b) => { b.disabled = true; });
}

// 配信側が10分キャッシュするので、古い版を見ていないか利用者が確かめられるようにする
$('build').textContent = '配信日時: ' + document.lastModified;

render();
updateUI();
</script>
</body>
</html>
