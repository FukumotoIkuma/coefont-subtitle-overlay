<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoeFont Subtitle Overlay</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="src/main.js"></script>
</head>
<body>

<div id="status"></div>

<div id="stage">
  <div id="gizmo"><span id="gizmoLabel"></span><b data-c="t"></b><b data-c="b"></b><b data-c="l"></b><b data-c="r"></b><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div>
  <div id="divider" hidden></div>
  <div id="note"></div>
</div>

<div class="docks">
  <div class="dock">
    <h2>ソース</h2>
    <div class="row"><span class="dot" id="dotSub"></span>
      <input type="url" id="url" placeholder="CoeFont の招待URLを貼る" autocomplete="off" spellcheck="false">
      <button data-act="loadUrl">読み込む</button></div>
    <div class="row"><span class="dot" id="dotSlide"></span><span class="name">スライドショーのウィンドウ</span>
      <button data-act="pickSlide" id="btnSlide">選択</button><button data-act="stopSlide" id="stopSlide">停止</button></div>
    <button data-act="toggleFull" id="btnFull"></button>
    <div class="hint">切り抜いたあとで CoeFont の設定(A− A+、Single / All など)を変えたいときに使う。</div>
  </div>

  <div class="dock">
    <h2>レイアウトと字幕</h2>
    <div class="row"><label for="layoutSel">配置</label>
      <select id="layoutSel">
      </select></div>
    <div class="row" id="rowBand"><label for="band" id="bandLabel"></label><input type="range" id="band" min="8" max="60" step="0.5"><output id="oBand"></output></div>
    <div class="row" id="rowBlend"><label for="blend">背景の透過</label>
      <select id="blend">
        <option value="normal">なし</option>
        <option value="multiply">白地を抜く(暗い文字用)</option>
        <option value="screen">黒地を抜く(明るい文字用)</option>
      </select></div>
    <div class="row" id="rowOpacity"><label for="subOpacity">不透明度</label><input type="range" id="subOpacity" min="20" max="100"><output id="oOpacity"></output></div>
    <div class="row"><label for="winW">CoeFont の窓の幅</label><input type="range" id="winW" step="10"><output id="oWinW"></output></div>
    <div class="row"><label for="winH">CoeFont の窓の高さ</label><input type="range" id="winH" step="10"><output id="oWinH"></output></div>
    <div class="hint" id="winHint"></div>
    <button data-act="fitWindow" id="btnFit">窓の形を字幕の領域に合わせる</button>
    <div class="hint" id="fitNote"></div>
    <div class="row"><button data-act="resetCrop">切り抜きを初期化</button><button data-act="resetWindow">窓の形を初期化</button><button data-act="resetPos" id="btnResetPos">配置を初期化</button></div>
    <div class="hint" id="gizmoHint"></div>
  </div>

  <div class="dock">
    <h2>出力</h2>
    <div class="row"><span class="dot" id="dotOut"></span><span class="name" id="outState"></span></div>
    <button class="big primary" data-act="openOutput" id="btnOut">出力ウィンドウを開く</button>
    <div class="hint">出力は別のウィンドウかタブで開く。聴衆側ディスプレイへ移し(タブならウィンドウから切り離して)、その中の「全画面にする」を押す。位置・範囲・透過は、全画面中もこの画面から調整できる。</div>
  </div>
</div>

<div id="build" class="hint"></div>

</body>
</html>
